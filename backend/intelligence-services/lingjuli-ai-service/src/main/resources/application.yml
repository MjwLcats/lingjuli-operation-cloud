server.port: ${SERVER_PORT:9231}
spring:
  application.name: lingjuli-ai-service
  datasource: {url: '${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/lingjuli_ai?serverTimezone=Asia/Shanghai}', username: '${MYSQL_USERNAME:root}', password: '${MYSQL_PASSWORD:}'}
  flyway.enabled: ${FLYWAY_ENABLED:true}
  cloud.nacos.discovery.enabled: ${NACOS_DISCOVERY_ENABLED:false}
lingjuli.ai.ollama.base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
management.endpoints.web.exposure.include: health,info,prometheus
