server.port: ${SERVER_PORT:9201}
spring:
  application.name: lingjuli-identity-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/lingjuli_identity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  flyway.enabled: ${FLYWAY_ENABLED:true}
  cloud.nacos.discovery:
    enabled: ${NACOS_DISCOVERY_ENABLED:false}
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
management.endpoints.web.exposure.include: health,info,prometheus
